name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android platform, NDK and CMake
        run: sdkmanager "platforms;android-37" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APKs (ARM32 and ARM64)
        if: github.ref_type != 'tag'
        run: ./gradlew :fusionApp:assembleArm32Debug :fusionApp:assembleArm64Debug

      - name: Verify Debug APK ABIs and assets
        if: github.ref_type != 'tag'
        run: python3 scripts/verify-abi-apks.py debug

      - name: Decode keystore
        if: github.ref_type == 'tag'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/keystore.jks"

      - name: Build Release APKs (ARM32 and ARM64)
        if: github.ref_type == 'tag'
        run: ./gradlew :fusionApp:assembleArm32Release :fusionApp:assembleArm64Release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify Release APK ABIs and assets
        if: github.ref_type == 'tag'
        run: python3 scripts/verify-abi-apks.py release

      - name: Upload ARM32 Debug APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: fusionApp-arm32-debug
          path: fusionApp/build/outputs/apk/arm32/debug/*.apk

      - name: Upload ARM64 Debug APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: fusionApp-arm64-debug
          path: fusionApp/build/outputs/apk/arm64/debug/*.apk

      - name: Upload ARM32 Release APK
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: fusionApp-arm32-release-${{ github.ref_name }}
          path: fusionApp/build/outputs/apk/arm32/release/*.apk

      - name: Upload ARM64 Release APK
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: fusionApp-arm64-release-${{ github.ref_name }}
          path: fusionApp/build/outputs/apk/arm64/release/*.apk

      - name: Create GitHub Release assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            fusionApp/build/outputs/apk/arm32/release/*.apk
            fusionApp/build/outputs/apk/arm64/release/*.apk
